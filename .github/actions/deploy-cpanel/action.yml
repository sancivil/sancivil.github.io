# Composite, so the permissions and the production environment stay with the calling job. Only scripts/deploy
# (basic-ftp, installed without scripts) runs next to the FTPS secrets, never the site's own packages.
name: Deploy to cPanel
description: Uploads the site-live artifact of a run over FTPS, checks the live site, then tells IndexNow.
inputs:
  run-id:
    description: Run whose site-live artifact is deployed
    required: true
  publish-id:
    description: ERP publish number the build must carry; empty for a code release
    required: false
    default: ''
  allow-large-removal:
    description: yes lets the deploy remove more than 30% of the pages
    required: false
    default: 'no'
  site-url:
    description: The site's address; empty for https://faradayiq.com
    required: false
    default: ''
  ftps-host:
    description: FTPS server hostname, as on the certificate
    required: true
  ftps-user:
    description: FTPS account
    required: true
  ftps-password:
    description: FTPS password
    required: true
  ftps-port:
    description: FTPS port; empty for 21
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Download the build
      id: artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: site-live
        path: dist-live
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}

    - name: Report a missing build
      if: failure() && steps.artifact.outcome == 'failure'
      shell: bash
      run: echo "::error title=deploy/required-files::site-live"

    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.23.4

    - name: Install the FTPS client
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/deploy

    - name: Upload to the server
      shell: bash
      env:
        FTPS_HOST: ${{ inputs.ftps-host }}
        FTPS_USER: ${{ inputs.ftps-user }}
        FTPS_PASSWORD: ${{ inputs.ftps-password }}
        FTPS_PORT: ${{ inputs.ftps-port }}
        PUBLISH_ID: ${{ inputs.publish-id }}
        ALLOW_LARGE_REMOVAL: ${{ inputs.allow-large-removal }}
        SITE_URL: ${{ inputs.site-url }}
      run: node scripts/deploy/ftps-sync.mjs dist-live

    - name: Check the live site
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: node scripts/deploy/verify.mjs dist-live

    - name: Tell IndexNow
      continue-on-error: true
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: node scripts/deploy/indexnow.mjs dist-live
